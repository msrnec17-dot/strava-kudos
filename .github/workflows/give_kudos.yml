name: run-kudos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 21 * * *"

jobs:
  run-kudos:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libdbus-glib-1-2 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Install Playwright Firefox
        run: python -m playwright install firefox

      - name: Restore Strava session
        shell: bash
        run: |
          echo "${{ secrets.STRAVA_STATE_B64 }}" | base64 -d > strava_state.json
          ls -lh strava_state.json

      - name: Create output directory
        shell: bash
        run: |
          mkdir -p output
          ls -lah output

      - name: Run kudos script
        run: python -u give_kudos.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Check kudos log
        if: always()
        shell: bash
        run: |
          echo "Provjeravam root folder..."
          ls -lah
          echo ""
          echo "Provjeravam output folder..."
          ls -lah output || true
          echo ""
          echo "Prvih 20 redaka iz output/kudos_log.csv:"
          head -n 20 output/kudos_log.csv || true

      - name: Run analysis
        if: always()
        shell: bash
        run: |
          python -u analyze_kudos.py > output/kudos_analysis.txt

      - name: Check analysis output
        if: always()
        shell: bash
        run: |
          echo "Prvih 50 redaka iz output/kudos_analysis.txt:"
          head -n 50 output/kudos_analysis.txt || true

      - name: Upload kudos log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kudos-log
          path: output/kudos_log.csv
          if-no-files-found: warn

      - name: Upload kudos analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kudos-analysis
          path: output/kudos_analysis.txt
          if-no-files-found: warn
