name: run-kudos

on:
  workflow_dispatch:
  schedule:
    # Vremena su u UTC (što je 2 sata manje od našeg trenutnog vremena - CEST)
    - cron: "30 5 * * *"   # 07:30 CEST (Ranojutarnji treninzi)
    - cron: "30 7 * * *"   # 09:30 CEST (Kasniji jutarnji treninzi / dolazak na posao)
    - cron: "30 11 * * *"  # 13:30 CEST (Pauza za ručak)
    - cron: "30 15 * * *"  # 17:30 CEST (Nakon posla)
    - cron: "30 17 * * *"  # 19:30 CEST (Glavni večernji treninzi)
    - cron: "30 19 * * *"  # 21:30 CEST (Završetak dana)

jobs:
  run-kudos:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libdbus-glib-1-2 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Install Playwright Firefox
        run: python -m playwright install firefox

      - name: Restore Strava session
        shell: bash
        run: |
          echo "${{ secrets.STRAVA_STATE_B64 }}" | base64 -d > strava_state.json
          ls -lh strava_state.json

            - name: Run kudos script
        run: python -u give_kudos.py
