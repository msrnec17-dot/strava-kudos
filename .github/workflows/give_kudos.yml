name: run-kudos

on:
  workflow_dispatch:
  schedule:
    # Vremena su u UTC (oko +2 sata za CEST)
    - cron: "0 4 * * *"    # 06:00 CEST (rano ujutro)
    - cron: "0 6 * * *"    # 08:00 CEST (jutro)
    - cron: "0 8 * * *"    # 10:00 CEST (prijepodne)
    - cron: "0 10 * * *"   # 12:00 CEST (podne)
    - cron: "0 12 * * *"   # 14:00 CEST (rano poslijepodne)
    - cron: "0 14 * * *"   # 16:00 CEST (poslijepodne)
    - cron: "0 16 * * *"   # 18:00 CEST (predvečer)
    - cron: "0 18 * * *"   # 20:00 CEST (večer)
    - cron: "0 20 * * *"   # 22:00 CEST (kasna večer)
    - cron: "30 21 * * *"  # 23:30 CEST (kraj dana)

jobs:
  run-kudos:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libdbus-glib-1-2 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Install Playwright Firefox
        run: python -m playwright install firefox

      - name: Restore Strava session
        shell: bash
        run: |
          echo "${{ secrets.STRAVA_STATE_B64 }}" | base64 -d > strava_state.json
          ls -lh strava_state.json

      - name: Run kudos script
        run: python -u give_kudos.py
        env:
          PYTHONUNBUFFERED: "1"
